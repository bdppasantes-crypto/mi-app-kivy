name: Compilar APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Descargar codigo del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev libffi-dev uuid-dev libncurses5-dev libncursesw5-dev xz-utils zip unzip autoconf libtool pkg-config zlib1g-dev ccache lld

    - name: Instalar Buildozer y Cython
      run: |
        pip install --upgrade pip
        pip install "cython<3.0.0"
        pip install buildozer

    - name: Crear archivo buildozer.spec y forzar licencias
      run: |
        buildozer init
        # Forzar bandera en buildozer.spec
        sed -i 's/android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        sed -i 's/# android.api = 31/android.api = 33/' buildozer.spec
        
        # Pre-crear archivos de licencias del SDK para evitar bloqueos
        ANDROID_SDK_HOME="$HOME/.buildozer/android/platform/android-sdk"
        mkdir -p "$ANDROID_SDK_HOME/licenses"
        echo -e "\n24333f8a637bfa3e4d5991b63d75d975c64b2037" > "$ANDROID_SDK_HOME/licenses/android-sdk-license"
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_SDK_HOME/licenses/android-sdk-preview-license"

    - name: Compilar APK
      run: |
        buildozer -v android debug

    - name: Subir APK generado
      uses: actions/upload-artifact@v4
      with:
        name: App-Android-APK
        path: bin/*.apk
