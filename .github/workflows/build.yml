name: Compilar APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev libffi-dev uuid-dev libncurses5-dev libncursesw5-dev xz-utils zip unzip autoconf libtool pkg-config zlib1g-dev ccache lld

    - name: Instalar Buildozer y Cython
      run: |
        pip install --upgrade pip
        pip install cython==0.29.33
        pip install buildozer

    - name: Generar y parchear buildozer.spec
      run: |
        buildozer init
        # Forzar el uso de sdkmanager actualizado y aceptar licencias
        sed -i 's/android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        sed -i 's/# android.api = 31/android.api = 33/' buildozer.spec

    - name: Compilar APK
      run: |
        buildozer -v android debug

    - name: Subir APK generado
      uses: actions/upload-artifact@v4
      with:
        name: App-Android-APK
        path: bin/*.apk
